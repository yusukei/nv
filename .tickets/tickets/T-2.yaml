id: T-2
title: wrangler-compose から Codemagic へアプリを登録できるかを調べ、報告書にまとめる
state: closed
priority: medium
body: |-
  依頼 I-2「wrangler-compose に Codemagic のサービスへアプリケーションの登録ができるように拡張したい。可能か調査したい」に答える調査。コードは変えない。

  調べること:
  1. Codemagic でアプリを登録する手段: REST API（アプリの追加・リポジトリの接続・SSH 鍵や認証の渡し方）、CLI（codemagic-cli-tools など）があるか。公式文書で確かめ、出典の URL を書く
  2. 登録に要るもの: API トークンの取り方、チーム・リポジトリ（GitHub 連携か SSH か）、登録後にできること（環境変数・グループ・ビルドの起動・Webhook）、再登録や削除（名前で冪等にできるか）
  3. 料金・プランの制限、API の制限
  4. wrangler-compose に入れる形の案: compose ファイルに新しい `type`（例: codemagic）を足す形か、別の仕組みか。`--env` ごとの扱い（local では何もしない／何を示すか）、`up`・`down`・`ps`・`--dry-run` で何をするか、名前の付け方（`<プロジェクト>--<環境>--<名前>`）と合うか
  5. 要求仕様とのかね合い: 現在の範囲（docs/wrangler-compose/requirements/common.html の REQ-015 安全・REQ-016 手で行う段取りを持たない・範囲外「Wrangler のコマンドでも Cloudflare の API でも行えない操作」）や README の「Cloudflare Workers の環境を docker compose のように扱う」と衝突する点。要求仕様をどう変える必要があるか
  6. シークレット（Codemagic の API トークン）の扱いが REQ-015 を満たせるか
  7. 可能なら、手元で API を実際に叩いて確かめる（トークンが無ければ、文書のみで確かめたと明記する）。推測は推測と書く

  完了の条件:
  - 成果物として、上の 1〜7 の結果と、「できる／条件付きでできる／できない」の結論、入れるならどの形が良いかの推奨と、そのときに要るチケットの分け方の案をまとめた HTML（または Markdown）を ticket_artifact で付ける
  - 報告書に、利用者が決める必要があること（範囲を Cloudflare 以外に広げてよいか、など）を一覧にする
