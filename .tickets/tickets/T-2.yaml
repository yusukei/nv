report:
  changed: |-
    wrangler-compose のコードと仕様書は変えていない。調査報告(成果物)を付けた。
    marche-ar の deploy/.env.production に、Codemagic のビルドに要る値の欄と CODEMAGIC_APP_ID を足し(値は利用者が入れた)、複数行の値 2 つの囲みを引用符に直した。
  verified: |-
    本物の Codemagic で、トークンで読めるもの・アプリの登録(同じリポジトリの 2 回目も通る)・グループと変数の一括登録・アプリの削除を確かめた。
    .env.production だけから、使っているアプリと同じ 7 グループ・21 変数を作れることを、書き込まずに読み比べて確かめた。
    Secure の値は API でも読み返せないことを確かめた。
  remaining: |-
    報告書の D1〜D8(書き方の形・リポジトリの URL・ID が無いとき・手元・down・確かめ・空の値・ps)が未決。
    試験で作ったアプリのグループ 5 つが Codemagic に残っている(API では消せない。サポートへの依頼が要る)。
    要求仕様の改訂・詳細仕様・実装・本物での受け入れ確認は、報告書のチケットの分け方の案のとおり後続で行う。
