id: Q-13
state: answered
question: Codemagic のアプリを登録しなくなったあと、down でそのアプリを消しますか
background: I-5 で、up からアプリを登録する機能を削除します。登録は Codemagic の Web 画面で行い、そのアプリの ID を .env.<環境> の CODEMAGIC_APP_ID に利用者が書く形にします。いまの down は、変数グループを消したあとにアプリも消し、CODEMAGIC_APP_ID の行も消します(REQ-021)。このままだと、down のあとで up しても動きません。利用者が Web 画面でアプリを作り直し、ID を書き直す必要があります。
intent: down でアプリを消すかどうかを決め、REQ-021 の down の記述を直したい
options:
- key: a
  label: アプリは消さない。down で消すのは変数グループだけ
  effect: CODEMAGIC_APP_ID とアプリは残ります。そのため、down のあとの up で元に戻ります。アプリ自体を消したいときは、Web 画面で消します。
- key: b
  label: いままでどおり、アプリも消して CODEMAGIC_APP_ID の行も消す
  effect: Codemagic に何も残りません。ただし、もう一度 up する前に、Web 画面での登録と ID の書き直しが毎回必要になります。また、Web で登録したアプリを道具が消すことになります。
recommend: a
why: 作ったものが消すという形に合うからです。利用者が Web で作ったアプリは利用者が消し、道具が作る変数グループは道具が消します。また、down と up を繰り返しても手作業が増えません。
