name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # Real download from nodejs.org, run through the managed Node (DES-013).
      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          nv="$PWD/target/release/nv"
          export NV_HOME="$RUNNER_TEMP/nvhome"
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          echo '{"name":"smoke","private":true}' > package.json
          echo 24.11.1 > .node-version
          test "$("$nv" run node --version)" = v24.11.1
          "$nv" run npm install --no-audit --no-fund semver@7.6.3 >/dev/null
          test "$("$nv" run semver 1.2.3 -i minor)" = 1.3.0
          test "$("$nv" run node -e 'console.log(process.argv[1])' 'a&b')" = 'a&b'
      # wrangler-compose `--env local` end to end, without Cloudflare.
      # Windows: stopping the runtime is not verified yet, so only build there.
      - name: wrangler-compose local test
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export NV_HOME="$RUNNER_TEMP/nvhome"
          BIN="$PWD/target/release" bash crates/wrangler-compose/tests/local-smoke.sh
      # The remote flow against a fake Cloudflare API (answers retypes
      # through util-linux `script`, so Linux only).
      - name: wrangler-compose remote test (fake API)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export NV_HOME="$RUNNER_TEMP/nvhome"
          BIN="$PWD/target/release" bash crates/wrangler-compose/tests/remote-smoke.sh
      # Containers (REQ-020) locally with Docker, which the Linux runners have
      # (two projects at once, rebuild, Ctrl+C, crash, images). Wrangler asks
      # Cloudflare for registry credentials before it pulls a registry image,
      # even a public one, so the registry image of the fixture stops without
      # a login; until that is settled, a failure here does not fail CI.
      - name: wrangler-compose container test
        if: runner.os == 'Linux'
        continue-on-error: true
        shell: bash
        run: |
          export NV_HOME="$RUNNER_TEMP/nvhome"
          BIN="$PWD/target/release" bash crates/wrangler-compose/tests/container-smoke.sh
      - name: wrangler-compose build test
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/target/release"
          export NV_HOME="$RUNNER_TEMP/nvhome"
          cp -R crates/wrangler-compose/tests/fixture "$RUNNER_TEMP/wcproj" && cd "$RUNNER_TEMP/wcproj"
          # The fixture's secret takes its value from a variable (REQ-005).
          export STRIPE_KEY=sk_test_build
          "$bin/nv" run npm install --no-audit --no-fund >/dev/null
          "$bin/wrangler-compose" --env local build
          if "$bin/wrangler-compose" up; then echo "up without --env must fail"; exit 1; fi
