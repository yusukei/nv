name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      - run: cargo build --release --workspace
      # Real download from nodejs.org, run through the managed Node (DES-013).
      - name: smoke test
        shell: bash
        run: |
          set -euo pipefail
          nv="$PWD/target/release/nv"
          export NV_HOME="$RUNNER_TEMP/nvhome"
          mkdir -p "$RUNNER_TEMP/proj" && cd "$RUNNER_TEMP/proj"
          echo '{"name":"smoke","private":true}' > package.json
          echo 24.11.1 > .node-version
          test "$("$nv" run node --version)" = v24.11.1
          "$nv" run npm install --no-audit --no-fund semver@7.6.3 >/dev/null
          test "$("$nv" run semver 1.2.3 -i minor)" = 1.3.0
          test "$("$nv" run node -e 'console.log(process.argv[1])' 'a&b')" = 'a&b'
      # wrangler-compose without touching Cloudflare: build is a dry run.
      - name: wrangler-compose smoke test
        shell: bash
        run: |
          set -euo pipefail
          bin="$PWD/target/release"
          wc="$bin/wrangler-compose"
          export NV_HOME="$RUNNER_TEMP/nvhome"
          mkdir -p "$RUNNER_TEMP/wcproj/src" && cd "$RUNNER_TEMP/wcproj"
          echo '{"name":"wcproj","private":true}' > package.json
          echo 24.11.1 > .node-version
          echo 'export default { fetch() { return new Response("ok") } }' > src/index.js
          echo '{"name":"wcproj","main":"src/index.js","compatibility_date":"2026-09-01","env":{"staging":{"name":"wcproj-staging"}}}' > wrangler.jsonc
          "$bin/nv" run npm install --no-audit --no-fund --save-dev wrangler@4.128.0 >/dev/null
          "$wc" --env staging build
          if "$wc" up; then echo "up without --env must fail"; exit 1; fi
