  text: '前提を直した: URL だけの POST /apps は、GitHub App が届くリポジトリでも必ず generic(Manually added)になる(本物で確かめた)。Codemagic の画面と同じく GitHub から読んだリポジトリの情報を repo として送れば github で登録できる。登録の前に GitHub を読み(非公開は GITHUB_TOKEN か git の資格)、同じリポジトリのアプリが既にあれば止まる(Codemagic は 2 度目に既存のアプリを返す)。generic なら消して止まる処理は残す'
