    compose.rs: Worker に placement・observability・cache を足し、WORKER_KEYS に入れて値を検査（mode は smart だけ、enabled は true/false、head_sampling_rate は 0〜1、ほかのキーは使えない）
    configs.rs: 書いた値だけを手元とリモートの Worker の設定に出す（書かなければ出さない）
    compose.rs・configs.rs に単体試験を 3 つ足した
    docs/wrangler-compose/requirements/write.html: Worker のキーの表と説明に 3 つのキーを足した
  verified: |-
    cargo test -p wrangler-compose: 81 件すべて通る（ポートを開く 4 件はサンドボックスの外で回した）
    dry-run（--env local --dry-run up）: 3 つのキーを書いた compose ファイルが「このキーは使えません」にならず検査を通る
    mode: off・head_sampling_rate: 2 は services.web.placement.mode・services.web.observability.head_sampling_rate を示すエラーになる（1 キー 1 件）
    既存の試験（キーを書かない Worker）の結果は変わらない
  remaining: |-
    コミットはまだ
    リモートへの実際のデプロイで Cloudflare に反映されるかは試していない
