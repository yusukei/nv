  text: |-
    この依頼はもうチケット T-6「GitHub App で結ばれていないリポジトリを Codemagic に登録したら止まる」になっていて、作業中です。中身は次のとおりで、ご依頼の範囲をすべて含んでいます。
    - 登録したあとに GET /apps/{id} でリポジトリの種類(provider)を確かめる
    - github.com の URL なのに種類が github でなければ、作ったアプリを消して止まる(CODEMAGIC_APP_ID も書かない)

    同じチケットが二つにならないよう、新しいチケットは作っていません。今のコード(crates/wrangler-compose/src/codemagic.rs の登録の処理)は、登録が成功すると何も確かめずに CODEMAGIC_APP_ID を書き足しています。T-6 はまさにこの部分を直すものです。
