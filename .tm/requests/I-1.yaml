  text: |-
    依頼の半分をチケット T-1 にしました(placement・observability・cache を services.<名前> に書けるようにする)。

    残りの「name で既存の資源を引き継げるか」は、仕様と実装を読んだ答えは「今の仕様では引き継げない」です。
    - Worker・資源の名前は、道具が `<プロジェクト>--<環境>--<名前>` にします(crates/wrangler-compose/src/remote.rs の names・env_prefix)。name を書くと、その後ろの部分だけが変わります。前に付く部分は消せません。
    - そのため name: tool-launcher-api にしても、Cloudflare には `<プロジェクト>--<環境>--tool-launcher-api` ができ、既存の tool-launcher-api・tool-launcher(D1)・tool-launcher(R2)は使われません。
    - Durable Object の VersionKeeper も、Worker の名前で決まる(configs.rs の script_name)ので、同じく引き継げません。
    - これは仕様書の利用者の決定です(docs/wrangler-compose/requirements/write.html:156。「名前がぶつからない」ため)。REQ-006 も「名前だけで持ち主が分かる」ことを求めています。

    既存の資源を使う方法は、仕様を変える判断になります。例: (a) 今のまま、移し替えをする。(b) 前に付く部分を外して、名前をそのまま使えるキーを足す(名前が他のプロジェクトとぶつかる危険が増えるので、仕様の見直しが要る)。どちらにするかは利用者が決めることで、決まったら起票します。
