id: I-1
words: |-
  wrangler-compose を拡張したい(app-launcher から。利用者「wrangler-composeを拡張しましょう。」)。

  app-launcher の Worker(tool-launcher-api)を wrangler-compose でデプロイするため、今の wrangler.toml にあって compose ファイルに書けない次の設定を、services.<名前> に書けるようにしてほしい(手元の dry-run では「このキーは使えません」になり、Worker のフォルダの wrangler.toml にも置けない):
  1. placement(Smart Placement。今は [placement] mode = "smart"。Worker を D1 の近くで動かすため。無いと D1 への問い合わせのたびに遠くへ往復する)
  2. observability(今は [observability] enabled = true / head_sampling_rate = 1。ダッシュボードでログを見るため)
  3. cache(今は [cache] enabled = false)

  あわせて確かめたいこと: services.<名前>.name で、既にある Cloudflare の資源(Worker tool-launcher-api、D1 tool-launcher、R2 tool-launcher、Durable Object VersionKeeper のデータ)をそのまま引き継いで使えるか。名前が変わると D1・R2 のデータの移し替えが要り、Durable Object のデータは引き継げないため。
