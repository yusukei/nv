    - `down --purge`: 作り直せないもの（D1・R2・KV のデータ、コンテナのイメージ）も消す

    この線引きを Codemagic に当てはめると、次のようになると考えます。
    - **グループと変数:** 値はすべて .env.<環境> から作り直せるので、`down` で消す。
    - **アプリ:** 消すとビルドの履歴が消え、ID も変わります。作り直せないので、`--purge` のときだけ消す。グループを先に消す順なので、ここは問題になりません。

    この分け方で提案を出し直しました。ほかは R-10 のままです。この内容でよければ、ボタンで起票してください。直したいところがあれば、そのまま返信してください。
  proposal:
