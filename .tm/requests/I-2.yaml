    state: open
    decided:
    - wrangler-compose の定義を広げ、Codemagic の API でアプリの登録とグループ・変数の登録を行えるようにする
    - Codemagic のアプリは環境ごとに 1 つ作る。作ったら、そのアプリの ID を .env.<環境> の CODEMAGIC_APP_ID に書く
    - グループの名前に環境を入れない。値はその環境の .env.<環境> から取る
    - グループは compose ファイルの設定に従う。書いたグループは作って中身をそろえ、書いていないグループはその環境のアプリから消す
    - secret の値は、まだ無いときだけ作る。--update-secret を付けたときだけ上書きする
    - --purge の線引きは「作り直せるか」。作り直せるものは down で消し、作り直せないものは --purge のときだけ消す
    - down では、その環境のアプリのグループと変数を消す(.env から作り直せるため)
    - down --purge では、さらにその環境のアプリも消す(ビルドの履歴と ID は作り直せないため)。グループを先に消してから、アプリを消す
    - up や down が触るのは、その環境のアプリだけ
