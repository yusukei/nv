- id: R-9
  at: 2026-10-30T21:18:51.507137+09:00
  by:
    kind: agent
    name: 起票エージェント
    session: ab647444-dce9-4883-92e5-ac1924275852
  text: |-
    そのとおりです。報告書の D9 にも出ている問題で、グループの名前に環境を入れると、compose ファイルに `app_${ENV_NAME}` のような書き方が要ります。そうなると staging の up から見て production のグループが「書いていないグループ」になり、消してしまう事故が起きえます。

    .env を環境ごとに分けている意味を生かすなら、次の形がすっきりすると考えます（推奨）。

    - **Codemagic のアプリを環境ごとに 1 つ作る。** `CODEMAGIC_APP_ID` は .env.staging と .env.production にそれぞれ別の値で書く。同じリポジトリを何度でも登録できることは本物で確かめ済みです。
    - **グループの名前に環境を入れない**（例: `app`）。中身は、その環境の .env の値。
    - **up や down が触るのは、その環境のアプリだけ。** 別の環境のグループを消す事故（D9）が起きない。
    - **down では、その環境のアプリを消す。** グループを先に消してから、アプリを消す。C-7 の「グループも削除」と合い、D5 も決まります。

    気をつけること:
    - marche-ar の codemagic.yaml は今 `marche_staging` のように環境の入った名前を読んでいるので、書き直しが要ります。
    - Codemagic の画面ではアプリが環境の数だけ並び、名前はリポジトリ名で同じになります。見分けたいときは、C-2 のとおり登録名を手で直します。

    この形でよければ、決まったこととして起票の提案にまとめます。
