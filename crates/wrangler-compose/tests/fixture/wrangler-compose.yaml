name: shop
services:
  web:
    type: worker
    build: ./web
    compatibility_date: "2026-09-01"
    ports: ["8787:8787"]
    depends_on: [api]
    bindings:
      API: api
      FILES: files
  api:
    type: worker
    build: ./api
    compatibility_date: "2026-09-01"
    ports: ["8788:8788"]
    bindings:
      DB: db
      FILES: files
      UPLOADS: uploads
      CACHE: cache
      JOBS: jobs
      COUNTER: api.Counter
    consumes: [jobs]
    crons: ["*/5 * * * *"]
    durable_objects: [Counter]
    secrets: [STRIPE_KEY]
    environment:
      GREETING: hello
  db:
    type: d1
    migrations: ./api/migrations
  files:
    type: r2
    ports: ["9000:9000"]
    public: true
    public_port: 9100
    cors:
      - origins: ["http://localhost:8787"]
        methods: [GET, PUT]
        allowed_headers: [content-type]
  uploads:
    type: r2
    notifications:
      - queue: jobs
        events: [object-create, object-delete]
  cache:
    type: kv
  jobs:
    type: queue
